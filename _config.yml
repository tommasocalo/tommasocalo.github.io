title: Tommaso
tagline: Postdoctoral Researcher at the IT University of Copenhagen
url: https://tommasocalo.github.io
baseurl: ""
# gems: [jekyll-paginate]
# paginate: 5

# Use of `relative_permalinks` ensures post links from the index work properly.
# permalink: "/:title"
# relative_permalinks: true

sass:
  sass_dir: _sass
  style: compressed

author:
  name: Tommaso
  url: https://tommasocalo.github.io
  email: tomcal@itu.dk

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    default_lang: html
    css_class: 'syntax'

excerpt_separator: <!--more-->

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Latest News scroll behaviour: off | snap | friction
news_motion: friction

# Ambient background: sketch | none
background_art: sketch

<div class="cv-social-link" style="display: flex; --brand: {{ link.color }}; --brand-dark: {{ link.color-dark | default: link.color }}">
	<div class="cv-social-link-icon-wrapper">
		<a href="{{ link.url }}" tabindex="-1" aria-hidden="true"><i class="{{ link.class }}"></i></a>
	</div>
	<div class="cv-social-link-text-wrapper">
		<a href="{{ link.url }}">{{ link.description }}</a>
	</div>
</div>
